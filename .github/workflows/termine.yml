name: termine

on:
  push:
    paths:
      - "termine/**"
      - ".github/workflows/termine.yml"
  pull_request:
    paths:
      - "termine/**"
      - ".github/workflows/termine.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: termine/backend
    env:
      ENV: test
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      TEST_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      JWT_SECRET: ci-secret-that-is-long-enough-for-hs256
      # No adapter that talks to a real authority is ever enabled in CI.
      SCANNER_PROVIDERS: demo
      SCANNER_ENABLED: "false"
      PUSH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Migrations apply cleanly
        run: alembic upgrade head
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./ci.db"

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: termine/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: termine/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle
        # Exercises Metro, NativeWind and every route. Catches the version
        # mismatches that a typecheck alone cannot see.
        run: npx expo export --platform web --output-dir dist
