<!-- Stomatolog Beograd — Popravka zuba | Standalone redesign v3 (SR/EN/DE) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Popravka zuba se vrši ukoliko dođe do promene boje zuba, bola, krvarenja desnih, neprijatnog zadaha, i slično.">
<title>Popravka zuba — Stomatološka ordinacija Trbović</title>
<style>
  :root{
    --ink:#12312F;
    --ink-soft:#4E6A66;
    --petrol:#0E3A3C;
    --petrol-2:#145A57;
    --mint:#E7F2EC;
    --mint-2:#D8EBE2;
    --ground:#FBFDFC;
    --surface:#FFFFFF;
    --coral:#F1705F;
    --coral-deep:#D95545;
    --coral-soft:#FDE9E5;
    --sun:#F4B942;
    --line:#DCE8E2;
    --shadow-sm:0 1px 3px rgba(14,58,60,.08), 0 1px 2px rgba(14,58,60,.05);
    --shadow-md:0 10px 30px rgba(14,58,60,.12);
    --shadow-lg:0 24px 60px rgba(14,58,60,.18);
    --r-lg:28px;
    --r-md:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#E4F0EC; --ink-soft:#9DB8B2;
      --petrol:#0B2627; --petrol-2:#0F3B38;
      --mint:#12292A; --mint-2:#16302F;
      --ground:#0C1F20; --surface:#122A2B;
      --coral:#F1705F; --coral-deep:#E05B49; --coral-soft:#3A211E;
      --line:#1F3D3B;
      --shadow-sm:0 1px 3px rgba(0,0,0,.45);
      --shadow-md:0 10px 30px rgba(0,0,0,.5);
      --shadow-lg:0 24px 60px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{
    --ink:#12312F; --ink-soft:#4E6A66; --petrol:#0E3A3C; --petrol-2:#145A57;
    --mint:#E7F2EC; --mint-2:#D8EBE2; --ground:#FBFDFC; --surface:#FFFFFF;
    --coral:#F1705F; --coral-deep:#D95545; --coral-soft:#FDE9E5; --sun:#F4B942; --line:#DCE8E2;
    --shadow-sm:0 1px 3px rgba(14,58,60,.08), 0 1px 2px rgba(14,58,60,.05);
    --shadow-md:0 10px 30px rgba(14,58,60,.12);
    --shadow-lg:0 24px 60px rgba(14,58,60,.18);
  }
  :root[data-theme="dark"]{
    --ink:#E4F0EC; --ink-soft:#9DB8B2; --petrol:#0B2627; --petrol-2:#0F3B38;
    --mint:#12292A; --mint-2:#16302F; --ground:#0C1F20; --surface:#122A2B;
    --coral:#F1705F; --coral-deep:#E05B49; --coral-soft:#3A211E; --line:#1F3D3B;
    --shadow-sm:0 1px 3px rgba(0,0,0,.45);
    --shadow-md:0 10px 30px rgba(0,0,0,.5);
    --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--ground); color:var(--ink);
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
  a{color:var(--petrol-2);text-decoration:none}
  :root[data-theme="dark"] a, body a{transition:color .2s}
  a:hover{text-decoration:underline}
  img{max-width:100%;display:block}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:.74rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--coral-deep);
  }
  .eyebrow:before{content:"";width:26px;height:2px;background:var(--coral);border-radius:2px}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 28px;border-radius:999px;font-weight:800;font-size:.95rem;
    transition:transform .25s ease, box-shadow .25s ease, background .25s;
    text-decoration:none!important;border:0;cursor:pointer;
  }
  .btn.coral{background:var(--coral);color:#fff;box-shadow:0 10px 24px rgba(241,112,95,.38)}
  .btn.coral:hover{background:var(--coral-deep);transform:translateY(-2px);box-shadow:0 14px 32px rgba(241,112,95,.45)}
  .btn.line{border:2px solid var(--line);color:var(--ink);background:transparent}
  .btn.line:hover{border-color:var(--petrol-2);color:var(--petrol-2);transform:translateY(-2px)}
  .btn svg{width:17px;height:17px;stroke:currentColor;flex:0 0 auto}

  /* ---------- header ---------- */
  header.site{
    position:sticky;top:0;z-index:80;
    background:color-mix(in srgb, var(--ground) 82%, transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .site .wrap{display:flex;align-items:center;gap:16px;min-height:82px}
  .logo{display:flex;align-items:center;flex:0 0 auto}
  .logo img{height:54px;width:auto}
  .logo img.lg-white{display:none}
  @media (prefers-color-scheme: dark){
    .logo img.lg-ink{display:none}
    .logo img.lg-white{display:block}
  }
  :root[data-theme="dark"] .logo img.lg-ink{display:none}
  :root[data-theme="dark"] .logo img.lg-white{display:block}
  :root[data-theme="light"] .logo img.lg-ink{display:block}
  :root[data-theme="light"] .logo img.lg-white{display:none}

  nav.main{margin-left:auto}
  nav.main > ul{display:flex;list-style:none;gap:2px;flex-wrap:wrap}
  nav.main > ul > li{position:relative}
  nav.main a.top{
    display:block;padding:10px 13px;color:var(--ink);font-size:.92rem;font-weight:700;
    border-radius:999px;transition:background .25s,color .25s;white-space:nowrap;
  }
  nav.main a.top:hover, nav.main li.open > a.top{background:var(--mint);text-decoration:none;color:var(--petrol-2)}
  nav.main li.active > a.top{background:var(--petrol);color:#fff}
  .caret{display:inline-block;margin-left:5px;font-size:.6em;transform:translateY(-2px);transition:transform .25s;opacity:.7}
  li.open .caret{transform:rotate(180deg)}
  ul.drop{
    position:absolute;top:calc(100% + 10px);left:0;min-width:260px;list-style:none;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    box-shadow:var(--shadow-lg);padding:8px;
    opacity:0;visibility:hidden;transform:translateY(10px);
    transition:opacity .25s ease, transform .25s ease, visibility .25s;
  }
  li.open > ul.drop{opacity:1;visibility:visible;transform:translateY(0)}
  ul.drop a{
    display:block;padding:10px 14px;border-radius:12px;color:var(--ink);font-size:.92rem;font-weight:600;
    transition:background .2s,color .2s,padding-left .2s;
  }
  ul.drop a:hover{background:var(--mint);color:var(--petrol-2);text-decoration:none;padding-left:18px}
  ul.drop a.active{background:var(--petrol);color:#fff}

  .lang{display:flex;background:var(--mint);border-radius:999px;padding:4px;margin-left:6px}
  .lang button{
    font:inherit;font-size:.76rem;font-weight:800;letter-spacing:.05em;
    padding:6px 11px;border-radius:999px;border:0;background:transparent;color:var(--ink-soft);
    cursor:pointer;transition:all .25s;
  }
  .lang button.on{background:var(--petrol);color:#fff;box-shadow:var(--shadow-sm)}
  .hdr-cta{margin-left:6px}
  .hdr-cta .btn{padding:11px 20px;font-size:.86rem}

  .burger{display:none;margin-left:auto;background:none;border:0;cursor:pointer;padding:8px}
  .burger span{display:block;width:24px;height:2.5px;background:var(--ink);margin:5px 0;border-radius:3px;transition:.3s}
  body.nav-open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  body.nav-open .burger span:nth-child(2){opacity:0}
  body.nav-open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

  /* ---------- hero ---------- */
  .hero{position:relative;background:var(--mint);overflow:hidden;
    border-radius:0 0 var(--r-lg) var(--r-lg)}
  .hero .dots{
    position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(var(--mint-2) 2.2px, transparent 2.2px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(circle at 85% 15%, black 0 32%, transparent 62%);
    mask-image:radial-gradient(circle at 85% 15%, black 0 32%, transparent 62%);
  }
  .hgrid{
    position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);
    gap:56px;align-items:center;padding-top:64px;padding-bottom:72px;
  }
  .kicker{
    display:inline-flex;align-items:center;gap:9px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:7px 16px;
    font-size:.8rem;font-weight:700;color:var(--petrol-2);box-shadow:var(--shadow-sm);
    animation:fadeUp .6s .05s ease both;
  }
  .kicker .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);animation:pulse 2.4s infinite}
  .hero h1{
    font-size:clamp(2.5rem,5.2vw,4rem);margin-top:20px;color:var(--ink);
    animation:fadeUp .6s .15s ease both;
  }
  .hero h1 em{
    font-style:normal;color:var(--coral-deep);position:relative;display:inline-block;
  }
  .hero h1 em svg{
    position:absolute;left:0;right:0;bottom:-10px;width:100%;height:12px;
  }
  .hero h1 em svg path{
    stroke:var(--coral);stroke-width:3.4;fill:none;stroke-linecap:round;
    stroke-dasharray:220;stroke-dashoffset:220;animation:draw 1s .9s ease forwards;
  }
  .hero .tagline{margin-top:22px;font-size:1.16rem;color:var(--ink-soft);max-width:46ch;animation:fadeUp .6s .25s ease both}
  .cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px;animation:fadeUp .6s .35s ease both}
  .trust{display:flex;gap:24px;flex-wrap:wrap;margin-top:34px;color:var(--ink-soft);font-size:.87rem;animation:fadeUp .6s .45s ease both}
  .trust span{display:inline-flex;align-items:center;gap:8px;font-weight:600}
  .trust svg{width:16px;height:16px;stroke:var(--coral-deep)}

  .hphoto{position:relative;justify-self:center;width:min(100%,540px);animation:fadeUp .7s .3s ease both}
  .arch{
    position:relative;aspect-ratio:16/9.2;border-radius:150px 28px 28px 28px;
    overflow:hidden;box-shadow:var(--shadow-lg);
  }
  .arch img{width:100%;height:100%;object-fit:cover;object-position:100% 50%;
    animation:kenburns 16s ease-in-out infinite alternate;transform-origin:80% 50%}
  .hphoto .halo{
    position:absolute;inset:-16px -16px auto -16px;aspect-ratio:16/9.2;z-index:-1;
    border-radius:150px 28px 28px 28px;
    background:linear-gradient(160deg,var(--coral-soft),transparent 60%);
  }
  .badge{
    position:absolute;left:-26px;bottom:34px;background:var(--surface);
    border-radius:16px;padding:12px 18px;box-shadow:var(--shadow-md);
    display:flex;flex-direction:column;gap:2px;animation:bob 5s ease-in-out infinite;
  }
  .badge .stars{color:var(--sun);letter-spacing:.16em;font-size:.82rem}
  .badge .lbl{font-size:.8rem;font-weight:800;color:var(--ink)}
  .badge2{
    position:absolute;right:-18px;top:52px;background:var(--petrol);color:#fff;
    border-radius:16px;padding:11px 16px;box-shadow:var(--shadow-md);
    font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:9px;
    animation:bob 6s .8s ease-in-out infinite;
  }
  .badge2 svg{width:16px;height:16px;stroke:#fff}

  /* ---------- section shells ---------- */
  section.block{padding:72px 0}
  .sec-head{max-width:640px;margin-bottom:38px}
  .sec-head h2{font-size:clamp(1.7rem,3.2vw,2.4rem);margin-top:10px}

  /* ---------- services grid ---------- */
  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .svc{
    position:relative;display:flex;align-items:center;gap:16px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    padding:20px 22px;transition:transform .3s ease, box-shadow .3s ease, border-color .3s;
  }
  .svc:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--petrol-2);text-decoration:none}
  .svc .ic{
    width:52px;height:52px;border-radius:16px;background:var(--mint);flex:0 0 auto;
    display:grid;place-items:center;transition:background .3s, transform .3s;
  }
  .svc .ic svg{width:24px;height:24px;stroke:var(--petrol-2);transition:stroke .3s}
  .svc:hover .ic{background:var(--petrol);transform:rotate(-6deg) scale(1.05)}
  .svc:hover .ic svg{stroke:#fff}
  .svc b{font-size:1rem;color:var(--ink)}
  .svc .arr{margin-left:auto;color:var(--ink-soft);transition:transform .3s,color .3s;font-weight:800}
  .svc:hover .arr{transform:translateX(5px);color:var(--coral-deep)}
  .svc.here{background:var(--petrol);border-color:var(--petrol)}
  .svc.here b{color:#fff}
  .svc.here .ic{background:rgba(255,255,255,.14)}
  .svc.here .ic svg{stroke:#fff}
  .svc.here .arr{color:var(--coral)}

  /* ---------- article ---------- */
  .article-shell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm);overflow:hidden}
  .article-inner{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0}
  .prose{padding:clamp(30px,4.5vw,56px)}
  .crumbs{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:14px}
  .crumbs b{color:var(--coral-deep)}
  .crumbs .sep{margin:0 7px;opacity:.5}
  .prose h2{font-size:clamp(1.8rem,3.4vw,2.5rem)}
  .prose p{margin:16px 0 0;max-width:64ch;color:var(--ink)}
  .prose p.lead{font-size:1.15rem;line-height:1.7;color:var(--ink)}
  .pull{
    margin-top:30px;padding:26px 30px;border-radius:var(--r-md);
    background:var(--petrol);color:#fff;position:relative;overflow:hidden;
    font-size:1.22rem;font-weight:700;line-height:1.5;letter-spacing:-.01em;
  }
  .pull:before{
    content:"“";position:absolute;right:14px;top:-22px;font-size:7rem;opacity:.14;
    font-family:Georgia,serif;
  }
  .side-facts{
    background:var(--mint);padding:clamp(26px,3.5vw,40px) clamp(22px,3vw,32px);
    display:flex;flex-direction:column;gap:20px;justify-content:center;
  }
  .fact{background:var(--surface);border-radius:var(--r-md);padding:18px 20px;box-shadow:var(--shadow-sm)}
  .fact .num{font-size:1.55rem;font-weight:800;color:var(--petrol-2);letter-spacing:-.02em}
  .fact .cap{font-size:.83rem;color:var(--ink-soft);font-weight:600}

  /* ---------- promo duo ---------- */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .pcard{
    position:relative;display:grid;grid-template-columns:150px 1fr;align-items:center;gap:20px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    padding:18px;transition:transform .3s ease, box-shadow .3s ease;overflow:hidden;
  }
  .pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);text-decoration:none}
  .pcard .thumb{border-radius:14px;overflow:hidden;aspect-ratio:16/10}
  .pcard .thumb img{width:100%;height:100%;object-fit:cover;transition:transform 2.5s ease}
  .pcard:hover .thumb img{transform:scale(1.08)}
  .pcard b{display:block;font-size:1.06rem;color:var(--ink)}
  .pcard p{font-size:.87rem;color:var(--ink-soft);margin-top:4px}
  .pcard .go{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font-size:.83rem;font-weight:800;color:var(--coral-deep)}
  .pcard:hover .go{gap:11px}
  .pcard .go{transition:gap .25s}

  /* ---------- testimonials marquee ---------- */
  .quotes-band{background:var(--mint);border-radius:var(--r-lg);padding:56px 0;overflow:hidden}
  .quotes-band .sec-head{padding:0 24px;margin:0 auto 34px;max-width:1180px;box-sizing:content-box}
  .marquee{display:flex;gap:20px;width:max-content;animation:scrollX 42s linear infinite}
  .quotes-band:hover .marquee{animation-play-state:paused}
  .qcard{
    width:390px;flex:0 0 auto;background:var(--surface);border-radius:var(--r-md);
    padding:24px 26px;box-shadow:var(--shadow-sm);border:1px solid var(--line);
    display:flex;flex-direction:column;gap:12px;
  }
  .qcard .stars{color:var(--sun);letter-spacing:.18em;font-size:.8rem}
  .qcard q{font-size:.95rem;color:var(--ink);quotes:"“" "”";line-height:1.6}
  .qcard .who{display:flex;align-items:center;gap:11px;margin-top:auto}
  .qcard .who .ava{
    width:38px;height:38px;border-radius:50%;background:var(--petrol);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:.85rem;letter-spacing:.02em;
  }
  .qcard .who b{font-size:.86rem;color:var(--ink)}

  /* ---------- CTA panel ---------- */
  .cta-panel{
    position:relative;background:var(--petrol);border-radius:var(--r-lg);
    padding:clamp(40px,6vw,72px) clamp(26px,5vw,72px);color:#fff;overflow:hidden;
  }
  .cta-panel .glow{
    position:absolute;width:480px;height:480px;border-radius:50%;
    background:radial-gradient(circle, rgba(241,112,95,.4), transparent 65%);
    right:-140px;top:-180px;animation:float 12s ease-in-out infinite alternate;
  }
  .cta-panel h2{font-size:clamp(1.8rem,3.6vw,2.6rem);max-width:20ch;position:relative}
  .cta-panel p{margin:14px 0 30px;color:rgba(255,255,255,.82);max-width:52ch;position:relative}
  .cta-panel .row{display:flex;gap:14px;flex-wrap:wrap;position:relative}
  .cta-panel .btn.line{border-color:rgba(255,255,255,.4);color:#fff}
  .cta-panel .btn.line:hover{border-color:#fff}
  .cta-panel .smile{position:absolute;right:48px;bottom:34px;width:150px;opacity:.25}
  .cta-panel .smile path{stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}

  /* ---------- footer ---------- */
  footer{margin-top:26px;background:var(--petrol);color:#B9CFC9;font-size:.88rem;
    border-radius:var(--r-lg) var(--r-lg) 0 0}
  footer .top{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:36px;padding:54px 0 40px}
  footer h2{color:#fff;font-size:1rem;margin-bottom:14px;letter-spacing:.02em}
  footer a{color:#8FD6CB}
  footer .big{color:#fff;font-weight:800}
  footer .fine{font-size:.78rem;color:#7FA39B;margin-top:12px;display:block}
  footer .flogo img{height:56px;margin-bottom:16px}
  .copy{border-top:1px solid rgba(255,255,255,.1);padding:18px 0;text-align:center;color:#6E938B;font-size:.8rem}

  /* ---------- anims ---------- */
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease, transform .7s ease}
  .reveal.in{opacity:1;transform:none}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(241,112,95,.5)}55%{box-shadow:0 0 0 8px rgba(241,112,95,0)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes float{from{transform:translate(0,0)}to{transform:translate(-34px,30px)}}
  @keyframes scrollX{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .swapping #i18n-zone{opacity:0;transform:translateY(8px)}
  #i18n-zone{transition:opacity .3s ease, transform .3s ease}

  @media (prefers-reduced-motion: reduce){
    *,*:before,*:after{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
    .reveal{opacity:1;transform:none}
    .marquee{flex-wrap:wrap;width:auto}
    .qcard{width:auto}
    .hero h1 em svg path{stroke-dashoffset:0}
  }

  /* ---------- responsive ---------- */
  @media (max-width: 1050px){
    .svc-grid{grid-template-columns:repeat(2,1fr)}
    footer .top{grid-template-columns:1fr 1fr;gap:28px}
  }
  @media (max-width: 980px){
    .hgrid{grid-template-columns:1fr;gap:44px;padding-top:48px;padding-bottom:56px}
    .hphoto{width:min(100%,380px)}
    .article-inner{grid-template-columns:1fr}
    .side-facts{flex-direction:row;flex-wrap:wrap}
    .fact{flex:1 1 160px}
    .duo{grid-template-columns:1fr}
    .hdr-cta{display:none}
  }
  @media (max-width: 880px){
    .burger{display:block}
    nav.main{
      position:fixed;inset:82px 0 0 auto;width:min(330px,88vw);z-index:90;
      background:var(--surface);box-shadow:var(--shadow-lg);
      transform:translateX(105%);transition:transform .35s ease;overflow-y:auto;
      padding:16px;margin-left:0;
    }
    body.nav-open nav.main{transform:none}
    nav.main > ul{flex-direction:column;gap:0}
    nav.main a.top{padding:13px 15px;border-radius:12px}
    ul.drop{position:static;box-shadow:none;border:0;padding:0 0 4px 14px;
      max-height:0;overflow:hidden;transition:max-height .35s ease;opacity:1;visibility:visible;transform:none}
    li.open > ul.drop{max-height:520px}
    .lang{margin-left:auto}
  }
  @media (max-width: 640px){

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function initials(name){ return name.split(' ').map(w=>w[0]).join('').slice(0,2); }

function renderNav(t){
  const nav = document.getElementById('mainnav');
  const ul = document.createElement('ul');
  t.nav.forEach(item=>{
    const li = document.createElement('li');
    if(item.active) li.classList.add('active');
    li.innerHTML = `<a class="top" href="${item.h}">${esc(item.t)}${item.sub?'<span class="caret">▼</span>':''}</a>`;
    if(item.sub){
      const drop = document.createElement('ul');
      drop.className = 'drop';
      item.sub.forEach(s=>{
        drop.appendChild(el(`<li><a href="${s.h}" class="${s.active?'active':''}">${esc(s.t)}</a></li>`));
      });
      li.appendChild(drop);
      li.querySelector('a.top').addEventListener('click', e=>{
        if(window.matchMedia('(hover: none), (max-width:880px)').matches || item.h==='#'){
          e.preventDefault();
          const was = li.classList.contains('open');
          nav.querySelectorAll('li.open').forEach(o=>o.classList.remove('open'));
          if(!was) li.classList.add('open');
        }
      });
      li.addEventListener('mouseenter', ()=>{ if(window.matchMedia('(hover: hover)').matches) li.classList.add('open'); });
      li.addEventListener('mouseleave', ()=>{ if(window.matchMedia('(hover: hover)').matches) li.classList.remove('open'); });
    }
    ul.appendChild(li);
  });
  nav.replaceChildren(ul);
}

function renderServices(t){
  const box = document.getElementById('svcgrid');
  box.replaceChildren(...t.icons.map((it,idx)=>{
    const a = el(
      `<a class="svc reveal ${it.here?'here':''}" href="${it.h}" style="transition-delay:${idx*60}ms">
        <span class="ic">${ICONS[it.i]}</span>
        <b>${esc(it.t)}</b>
        <span class="arr">→</span>
      </a>`);
    return a;
  }));
}

function renderBody(t){
  const box = document.getElementById('body-copy');
  box.replaceChildren(...t.body.map((p,i)=>el(`<p class="${i===0?'lead':''}">${esc(p)}</p>`)));
}

function renderPromos(t){
  const duo = document.getElementById('promoduo');
  duo.replaceChildren(...t.promos.map(p=>el(
    `<a class="pcard reveal" href="${p.h}">
      <span class="thumb"><img src="${IMG[p.img]}" alt="${esc(p.alt)}"></span>
      <span>
        <b>${esc(p.title)}</b>
        <p>${esc(p.desc)}</p>
        <span class="go">${esc(p.go)} <span>→</span></span>
      </span>
    </a>`)));
}

function renderQuotes(t){
  const m = document.getElementById('marquee');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cards = t.quotes.map(x=>
    `<div class="qcard">
      <span class="stars">★★★★★</span>
      <q>${esc(x.q)}</q>
      <span class="who"><span class="ava">${esc(initials(x.a))}</span><b>${esc(x.a)}</b></span>
    </div>`).join('');
  m.innerHTML = reduced ? cards : cards + cards;
}

let observer;
function watchReveals(){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); observer.unobserve(e.target); } });
  }, {threshold:.1});
  document.querySelectorAll('.reveal:not(.in)').forEach(n=>observer.observe(n));
}

function apply(lang){
  const t = T[lang];
  document.title = t.title;
  document.documentElement.lang = t.htmlLang;
  document.querySelectorAll('[data-t]').forEach(n=>{
    const k = n.getAttribute('data-t');
    if(t[k] !== undefined) n.textContent = t[k];
  });
  document.getElementById('h1').innerHTML = t.h1rich.replace('|', UNDERLINE);
  const hero = document.getElementById('heroimg');
  hero.src = IMG[t.heroImg]; hero.alt = t.heroAlt;
  ['cta-book','cta-band','cta-hdr'].forEach(id=>document.getElementById(id).href = t.bookUrl);
  renderNav(t); renderServices(t); renderBody(t); renderPromos(t); renderQuotes(t);
  ['sr','en','de'].forEach(l=>document.getElementById('btn-'+l).classList.toggle('on', lang===l));
  watchReveals();
}

function setLang(lang){
  if(lang===LANG){ return; }
  LANG = lang;
  localStorage.setItem('sb-lang', lang);
  document.body.classList.add('swapping');
  setTimeout(()=>{
    apply(lang);
    document.body.classList.remove('swapping');
    document.querySelectorAll('#i18n-zone .reveal').forEach(n=>n.classList.add('in'));
  }, 300);
}

document.addEventListener('click', e=>{
  if(!e.target.closest('nav.main') && !e.target.closest('.burger')){
    document.body.classList.remove('nav-open');
  }
});

apply(LANG);
</script>
